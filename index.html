.footer-row {

  align-items: center;

.status { font-size: 13px; }

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return null;
    const s = JSON.parse(raw);
    if (Array.isArray(s.queue) && s.queue.length > 0) return s;
    return null;
  } catch {
    return null;
  }
}
function saveState() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      queue: state.queue,
      pos: state.pos,
      correctCount: state.correctCount,
      attempted: state.attempted,
      wrongIds: Array.from(state.wrongIds),
      finished: state.finished,
    }));
  } catch {
    // storage non disponibile (es. modalità privata): si prosegue solo in memoria
  }
}
const saved = loadState();
const state = saved ? {
  queue: saved.queue,
  pos: saved.pos || 0,
  correctCount: saved.correctCount || 0,
  attempted: saved.attempted || 0,
  wrongIds: new Set(saved.wrongIds || []),
  finished: !!saved.finished,
} : {
  queue: shuffle(QUESTIONS.map(q => q.id)),
  pos: 0,
  correctCount: 0,
  attempted: 0,
  wrongIds: new Set(),
  finished: false,
};
let selected = null;
let revealed = false;
const app = document.getElementById("app");
const total = QUESTIONS.length;
function render() {
  const current = QUESTIONS[state.queue[state.pos]];
  const roundLabel = state.queue.length === total ? "primo giro" : `ripasso — ${state.queue.length} in coda`;
  let body;
  if (state.finished) {
    body = `
      <div class="center">
        <div class="label">Set esaurito</div>
        <div class="big">${total} domande superate — ${state.attempted} tentativi totali</div>
        <button class="btn" id="restart-btn">Ricomincia</button>
      </div>`;
  } else if (current) {
    const optsHtml = current.options.map((opt, idx) => {
      let cls = "opt";
      let glyph = "\u2610";
      if (revealed) {
        if (idx === current.correct) { cls += " correct"; glyph = "\u2611"; }
        else if (idx === selected) { cls += " wrong"; glyph = "\u2612"; }
      }
      return `<button class="${cls}" data-idx="${idx}" ${revealed ? "disabled" : ""}>
        <span class="glyph">${glyph}</span><span>${opt}</span>
      </button>`;
    }).join("");
    const footer = revealed ? `
      <div class="footer-row">
        <span class="status ${selected === current.correct ? "ok" : "bad"}">
          ${selected === current.correct ? "Corretto" : "Errata — riproposta più avanti"}
        </span>
        <button class="btn" id="next-btn">Avanti →</button>
      </div>` : "";
    body = `
      <div class="qmeta">Lezione ${current.lezione} — domanda ${state.pos + 1} di ${state.queue.length}</div>
      <div class="qtext">${current.q}</div>
      <div class="options">${optsHtml}</div>
      ${footer}`;
  }
  app.innerHTML = `
    <header>
      <div>
        <div class="eyebrow">Paniere · Letteratura italiana</div>
        <h1>Di Veroli — quiz di ripasso</h1>
      </div>
      <div class="meta mono">${state.correctCount}/${state.attempted} corrette<br>${roundLabel}</div>
    </header>
    ${body}
  `;
  if (!state.finished) {
    app.querySelectorAll(".opt").forEach(btn => {
      btn.addEventListener("click", () => choose(parseInt(btn.dataset.idx, 10)));
    });
    const nextBtn = document.getElementById("next-btn");
    if (nextBtn) nextBtn.addEventListener("click", next);
  } else {
    const restartBtn = document.getElementById("restart-btn");
    if (restartBtn) restartBtn.addEventListener("click", restart);
  }
}
function choose(idx) {
  if (revealed) return;
  selected = idx;
  revealed = true;
  state.attempted += 1;
  const current = QUESTIONS[state.queue[state.pos]];
  if (idx === current.correct) {
    state.correctCount += 1;
  } else {
    state.wrongIds.add(current.id);
  }
  saveState();
  render();
}
function next() {
  selected = null;
  revealed = false;
  const isLast = state.pos + 1 >= state.queue.length;
  if (!isLast) {
    state.pos += 1;
  } else if (state.wrongIds.size > 0) {
    state.queue = shuffle(Array.from(state.wrongIds));
    state.wrongIds = new Set();
    state.pos = 0;
  } else {
    state.finished = true;
  }
  saveState();
  render();
}
function restart() {
  state.queue = shuffle(QUESTIONS.map(q => q.id));
  state.pos = 0;
  state.correctCount = 0;
  state.attempted = 0;
  state.wrongIds = new Set();
  state.finished = false;
  selected = null;
  revealed = false;
  try { localStorage.removeItem(STORAGE_KEY); } catch {}
  render();
}
render();
</script>
</body>
</html>
